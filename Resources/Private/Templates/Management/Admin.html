<html xmlns:f="http://typo3.org/ns/TYPO3/CMS/Fluid/ViewHelpers"
      xmlns:be="http://typo3.org/ns/TYPO3/CMS/Backend/ViewHelpers"
      xmlns:core="http://typo3.org/ns/TYPO3/CMS/Core/ViewHelpers"
      data-namespace-typo3-fluid="true"
>
<f:layout name="Module"/>

<f:section name="Content">
  <f:asset.module identifier="@dsh_mastodon/backend.js"/>

  <h1>Mastodon Admin</h1>
  <f:flashMessages queueIdentifier="{flashMessageQueueIdentifier}"/>
  <f:variable name="returnUrl" value="{f:be.uri(route: 'mastodon')}"/>

  <h2>Accounts</h2>
  <div class="recordlist">
    <div class="table-fit">
      <table class="table table-striped">
        <thead>
        <tr>
          <th class="col-responsive">UID</th>
          <th class="col-responsive">Domain</th>
          <th class="col-responsive">Account</th>
          <th class="col-control nowrap"></th>
        </tr>
        </thead>
        <tbody>
        <f:for each="{accounts}" as="account">
          <tr>
            <td>{account.uid}</td>
            <td><a href="https://{account.domain}" target="_blank">{account.domain}</a></td>
            <td><a href="https://{account.domain}/@{account.username}" target="_blank">{account.username}</a></td>
            <td>
              <form action="{reauthUri}" method="post" target="_top">
                <input type="hidden" name="uid" value="{account.uid}"/>
                <button type="submit" class="btn btn-default">
                  <f:translate key="admin.reauthorize" extensionName="DshMastodon"/>
                </button>
              </form>
            </td>
          </tr>
        </f:for>
        </tbody>
      </table>
    </div>
  </div>

  <h2>
    <f:translate key="admin.add-account" extensionName="DshMastodon"/>
  </h2>
  <form action="{authUri}" method="post" target="_top">
    <div style="max-width: 800px">
      <div class="form-section">
        <h3>
          <f:translate key="admin.add.step1" extensionName="DshMastodon"/>
        </h3>
        <label class="form-label" for="domain">
          <span>Domain</span>
        </label>
        <input class="form-control" type="text" name="domain" size="30" id="domain" required/>
        <p>
          <f:translate key="admin.domain.description" extensionName="DshMastodon"/>
        </p>
      </div>
      <div class="form-section">
        <h3>
          <f:translate key="admin.add.step2" extensionName="DshMastodon"/>
        </h3>
        <p>
          <f:translate key="admin.application.description" extensionName="DshMastodon"/>
        </p>
        <p>
          <a class="btn btn-default js-new-application" href="#will-open-mastodon">
            <f:translate key="admin.application.create" extensionName="DshMastodon"/>
          </a>
        </p>
        <dl>
          <dt>
            <f:translate key="admin.application.name" extensionName="DshMastodon"/>
          </dt>
          <dd>
            <f:translate key="admin.application.name.description" extensionName="DshMastodon"/>
          </dd>

          <dt>
            <f:translate key="admin.application.website" extensionName="DshMastodon"/>
          </dt>
          <dd>
            <f:translate key="admin.application.website.description" extensionName="DshMastodon"/>
          </dd>

          <dt>
            <f:translate key="admin.application.redirect" extensionName="DshMastodon"/>
          </dt>
          <dd><kbd>{redirect}</kbd></dd>

          <dt>
            <f:translate key="admin.application.permissions" extensionName="DshMastodon"/>
          </dt>
          <dd>
            <kbd>read</kbd>, <kbd>profile</kbd>, <kbd>write:media</kbd>, <kbd>write:statuses</kbd>
          </dd>
        </dl>
        <p>
          <f:translate key="admin.add.step3.description" extensionName="DshMastodon"/>
        </p>
      </div>
      <div class="form-section">
        <h3>
          <f:translate key="admin.add.step3" extensionName="DshMastodon"/>
        </h3>
        <div class="form-group">
          <label class="form-label" for="key">
            <span><f:translate key="admin.client-key" extensionName="DshMastodon"/></span>
          </label>
          <input class="form-control" type="text" name="clientId" size="60" id="key" required/>
        </div>
        <div class="form-group">
          <label class="form-label" for="secret">
            <span><f:translate key="admin.client-secret" extensionName="DshMastodon"/></span>
          </label>
          <input class="form-control" type="text" name="clientSecret" size="60" id="secret" required/>
        </div>
        <p>
          <f:translate key="admin.add.additional-login" extensionName="DshMastodon" />
        </p>
        <div class="form-group">
          <button type="submit" class="btn btn-primary">
            <f:translate key="admin.add.step3.submit" extensionName="DshMastodon"/>
          </button>
        </div>
      </div>
    </div>
  </form>

</f:section>
</html>
